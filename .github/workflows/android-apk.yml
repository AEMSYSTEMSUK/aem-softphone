# #230: build an installable Android APK of The One MSP Phone (1 Nov 2026). Run from Actions > "Android APK" > Run workflow.
# Release build with the JS bundled in (no dev server needed), signed with the Expo template's DEBUG key - fine for
# sideloading test phones, NOT for Google Play (Play needs the upload key; add it as secrets when we publish).
# Secret GOOGLE_SERVICES_JSON_B64 (optional) = base64 of the Firebase google-services.json -> enables ringing when locked.
name: Android APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npm run typecheck
      - name: Firebase config (optional)
        env: { GS: '${{ secrets.GOOGLE_SERVICES_JSON_B64 }}' }
        run: |
          if [ -n "$GS" ]; then echo "$GS" | base64 -d > "$RUNNER_TEMP/google-services.json"; echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"; echo "push: on"; else echo "push: OFF (no GOOGLE_SERVICES_JSON_B64 secret)"; fi
      - run: npx expo prebuild -p android --no-install --clean
      - name: Gradle assembleRelease
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - uses: actions/upload-artifact@v4
        with:
          name: theonemsp-phone-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
